# 데이터센터 IP + 리눅스 xvfb 환경에서 운임 수집이 되는지 확인하는 탐침.
# 알림은 보내지 않고 수집만 한다. 수동 실행 전용.
name: probe-datacenter-ip

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: 러너 위치·ASN 확인
        run: |
          echo "--- 이 판정이 어느 IP에서 나왔는지 ---"
          curl -s --max-time 10 https://ipinfo.io/json || echo "ipinfo 조회 실패"

      - name: 비브라우저 요청 반응 (참고용, 503 예상)
        run: |
          echo -n "flight-api.naver.com/ -> "
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 10 https://flight-api.naver.com/ || true
          echo -n "flight.naver.com/     -> "
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 10 https://flight.naver.com/ || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq xvfb

      - name: 파서 회귀 테스트 (네트워크 무관)
        run: python -m pytest tests/ -q

      - name: 실수집 시도 (이것이 판정 기준)
        id: collect
        run: |
          set -o pipefail
          xvfb-run -a python scripts/naver_collector.py CJU CJJ 20260920 \
            --dump-dir artifacts 2>&1 | tee result.txt
        continue-on-error: true

      - name: 판정
        run: |
          if grep -qE "^  [0-9]{2}:[0-9]{2}" result.txt 2>/dev/null; then
            echo "PASS - 데이터센터 IP에서 운임 수집 성공"
            echo "수집 편수: $(grep -cE '^  [0-9]{2}:[0-9]{2}' result.txt)"
          else
            echo "FAIL - 운임을 받지 못했습니다"
            tail -30 result.txt 2>/dev/null || echo "(출력 없음)"
            exit 1
          fi

      - name: 실패 시 화면 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-artifacts
          path: |
            artifacts/
            result.txt
          if-no-files-found: ignore
          retention-days: 3
