# 30분마다 운임을 확인하고 조건에 맞으면 텔레그램으로 알린다.
#
# 필요한 저장소 Secrets:
#   TELEGRAM_BOT_TOKEN  @BotFather 에서 받은 봇 토큰
#   TELEGRAM_CHAT_ID    알림받을 chat id
#
# 감시 조건은 아래 env 에서 바꾸면 된다.
name: watch

on:
  schedule:
    # 정각/30분은 러너가 붐벼 밀리므로 7분, 37분에 실행한다.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      smoke:
        description: '임계가와 무관하게 현재 시세를 한 번 보내본다 (알림 연결 확인용)'
        type: boolean
        default: false

permissions:
  actions: write      # 감시 기간이 끝나면 이 워크플로를 스스로 비활성화하기 위해 필요

# ┌──────────────────────────────────────────────────────────┐
# │  여기 값만 본인 것으로 바꾸면 됩니다.                     │
# │  아래 예시는 "9/20 제주→청주 저녁 5~9시 출발,             │
# │  10만원 미만이면 알림, 9/20 20시에 종료" 입니다.          │
# └──────────────────────────────────────────────────────────┘
env:
  DEP: CJU              # 출발 공항 (제주)
  ARR: CJJ              # 도착 공항 (청주)
  DATE: '20260920'      # 출발일
  START_TIME: '1700'    # 이 시각 이후 출발편만
  END_TIME: '2100'      # 이 시각 이전 출발편만 (정각 포함)
  MAX_PRICE: '100000'   # 이 금액 미만이면 알림
  UNTIL: '202609202000' # 이 시각이 지나면 스스로 멈추고 워크플로를 끈다

  # 아래는 건드리지 마세요.
  # --until 은 실행 환경의 지역 시간으로 해석됩니다. 러너는 UTC 라
  # 이걸 빼면 종료 시각이 9시간 밀립니다.
  TZ: Asia/Seoul
  STATE_DIR: state/watch

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 이전 실행의 state.json 을 이어받아야 중복 알림을 막을 수 있다.
      - name: 이전 상태 복원
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      - name: 이미 만료됐는지 확인
        id: check
        run: |
          if [ -f "$STATE_DIR/state.json" ] && grep -q '"status": *"expired"' "$STATE_DIR/state.json"; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "감시 기간이 이미 끝났습니다."
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.expired == 'false'
        with:
          python-version: '3.12'

      - name: 의존성 설치
        if: steps.check.outputs.expired == 'false'
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq xvfb

      - name: 운임 확인
        if: steps.check.outputs.expired == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          xvfb-run -a python scripts/flight_watch.py \
            --dep "$DEP" --arr "$ARR" --date "$DATE" \
            --start-time "$START_TIME" --end-time "$END_TIME" \
            --max-price "$MAX_PRICE" \
            --until "$UNTIL" \
            --state-dir "$STATE_DIR" \
            --notify telegram --once \
            ${{ inputs.smoke && '--smoke-notify' || '' }}

      # 캐시 키는 매번 새로 쓰고 restore-keys 로 최신 것을 되찾는다.
      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: watch-state-${{ github.run_id }}

      # 여행 날짜가 지나면 스스로 멈춘다. 안 그러면 영원히 30분마다 깨어난다.
      - name: 만료되면 이 워크플로 비활성화
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$STATE_DIR/state.json" ] && grep -q '"status": *"expired"' "$STATE_DIR/state.json"; then
            echo "감시 기간 종료 - watch 워크플로를 비활성화합니다."
            gh workflow disable watch.yml --repo "$GITHUB_REPOSITORY"
          fi
